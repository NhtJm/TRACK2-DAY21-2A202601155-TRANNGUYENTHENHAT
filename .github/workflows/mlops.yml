name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Nguong accuracy toi thieu de deploy (mac dinh 0.70)'
        required: false
        default: '0.70'

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      should_deploy: ${{ steps.rollback_check.outputs.should_deploy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set MLflow remote tracking env (Bonus 1 - DagsHub, tuy chon)
        # Neu chua cau hinh secret MLFLOW_TRACKING_URI/USERNAME/PASSWORD thi
        # bo qua, train.py se dung tracking local mac dinh (khong loi).
        run: |
          if [ -n "${{ secrets.MLFLOW_TRACKING_URI }}" ]; then
            echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
            echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV
            echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV
            echo "Da cau hinh MLflow tracking remote (DagsHub)."
          else
            echo "Chua co secret DagsHub, dung MLflow tracking local mac dinh."
          fi

      - name: Authenticate to Cloud Storage
        # TODO 2: Ghi noi dung credentials ra file tam va set bien moi truong xac thuc.
        # GCP:   echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
        #        echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
        # AWS:   echo "AWS_ACCESS_KEY_ID=..." >> $GITHUB_ENV  (lay tu secrets)
        #        echo "AWS_SECRET_ACCESS_KEY=..." >> $GITHUB_ENV
        # Azure: echo "AZURE_STORAGE_CONNECTION_STRING=..." >> $GITHUB_ENV
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        #         Chi pull train_phase1.csv va eval.csv (khong can train_phase2.csv).
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        # TODO 4: Doc gia tri "accuracy" tu outputs/metrics.json bang Python inline.
        #         Set ket qua thanh output "accuracy" de job deploy co the doc.
        #
        # Goi y:
        #   ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
        #   echo "accuracy=$ACC" >> $GITHUB_OUTPUT
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy vua doc duoc: $ACC"

      - name: Compare with previous deployed model (Bonus 4 - rollback an toan)
        # Doc metrics.json CU tren GCS TRUOC (neu co), so sanh voi accuracy MOI.
        # Chi cho phep ghi de/deploy khi model moi >= model cu ve accuracy.
        id: rollback_check
        run: |
          python - <<'EOF'
          import json, os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          new_acc = json.load(open("outputs/metrics.json"))["accuracy"]
          old_blob = bucket.blob("models/latest/metrics.json")

          if old_blob.exists():
              old_metrics = json.loads(old_blob.download_as_text())
              old_acc = old_metrics.get("accuracy", 0.0)
              print(f"Model dang chay: accuracy={old_acc:.4f} | Model moi vua train: accuracy={new_acc:.4f}")
              should_deploy = new_acc >= old_acc
          else:
              print(f"Chua co model nao tren GCS. Model moi: accuracy={new_acc:.4f} -> cho phep deploy.")
              should_deploy = True

          print(f"should_deploy={should_deploy}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_deploy={'true' if should_deploy else 'false'}\n")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Upload model to Cloud Storage
        # TODO 5: Su dung cloud SDK de upload models/model.pkl len
        #         <bucket>/models/latest/model.pkl.
        #         Ten bucket lay tu secret CLOUD_BUCKET.
        # Bonus 4: chi upload (ghi de model dang chay) khi rollback_check cho phep.
        if: steps.rollback_check.outputs.should_deploy == 'true'
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          model_blob = bucket.blob("models/latest/model.pkl")
          model_blob.upload_from_filename("models/model.pkl")
          print(f"Da upload models/model.pkl len gs://{bucket_name}/models/latest/model.pkl")

          metrics_blob = bucket.blob("models/latest/metrics.json")
          metrics_blob.upload_from_filename("outputs/metrics.json")
          print(f"Da upload outputs/metrics.json len gs://{bucket_name}/models/latest/metrics.json")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        # TODO 6: Doc accuracy tu output cua job train.
        #         Neu accuracy < 0.70, ket thuc voi loi ro rang.
        #         Neu dat nguong, in thong bao va tiep tuc.
        #
        # Goi y:
        #   acc = float("${{ needs.train.outputs.accuracy }}")
        #   if acc < 0.70:
        #       raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
        #   print("PASSED: dang trien khai model.")
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          threshold = float("${{ github.event.inputs.threshold || '0.70' }}")
          should_deploy = "${{ needs.train.outputs.should_deploy }}" == "true"

          if acc < threshold:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < {threshold:.4f}. Huy deploy.")
          if not should_deploy:
              raise SystemExit(
                  f"BLOCKED: accuracy {acc:.4f} >= nguong {threshold:.4f} nhung khong tot hon "
                  "model dang chay (Bonus 4 rollback safety). Huy deploy."
              )
          print(f"PASSED: accuracy {acc:.4f} >= {threshold:.4f} va tot hon model cu. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # TODO 7: Restart service mlops-serve tren VM.
            # TODO 8: Cho server san sang roi goi curl /health de xac nhan.
            #         Neu health check that bai sau nhieu lan thu, thoat voi exit 1.
            #
            # Goi y:
            #   sudo systemctl restart mlops-serve
            #   sleep 5
            #   curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1
            sudo systemctl restart mlops-serve
            for i in 1 2 3 4 5 6; do
              sleep 5
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Health check lan $i chua san sang, thu lai..."
            done
            echo "Health check that bai sau nhieu lan thu."
            exit 1
